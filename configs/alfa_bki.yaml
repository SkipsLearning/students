# Задача банка: кредитный скоринг клиентов Альфа-Банка только по данным кредитных историй (БКИ).
# Соревнование: https://ods.ai/competitions/dl-fintech-bki
# Данные: data_for_competition.zip -> распаковать в data/data_for_competition
#
# Сравниваются подходы из постановки банка:
#   * стандартный — бустинг на агрегатах кредитной истории;
#   * альтернативный — рекуррентная сеть (GRU) на последовательности кредитов «как есть»
#     (одна доменная GRU и ансамбль GRU по фолдам, как в решении 7-го места);
#   * единая модель — объединяет эмбеддинг GRU, агрегаты и прогноз ансамбля GRU по фолдам.
# Метрика соревнования — ROC AUC (в отчёте есть и AUC, и Джини = 2·AUC − 1).
experiment:
  name: alfa_bki_unified
  seed: 42
  output_dir: runs

data:
  kind: alfa_bki
  alfa_bki:
    path: data/data_for_competition
    n_clients: 500000        # из 3 млн; null — все (не помещается в 16 ГБ RAM)
    take: latest             # самые поздние заявки: id растёт со временем, test соревнования ещё позже
    max_len: 32              # последних кредитов (у 99.9% клиентов их не больше)
    encoder_hidden: 64
    encoder_epochs: 4
    encoder_batch_size: 1024
    encoder_lr: 0.002
    cv_folds: 5              # GRU как самостоятельная модель: 5 фолдов на domain_fit + train

target:
  train_on: main

# Разбиение по времени: id растёт со временем подачи заявки, клиенты делятся на 24
# «периода» по порядку id. Проверка — на самых поздних, как в постановке банка.
split:
  scheme: time
  domain_fit_periods: [0, 6]   # ~29% — доменная GRU (её эмбеддинги идут в единую модель)
  train_periods: [7, 16]       # ~42% — единая модель
  val_periods: [17, 19]        # ~12% — early stopping, калибровка, число деревьев
  test_periods: [20, 23]       # ~17% — самые поздние заявки, итоговая оценка

sources:
  - name: bki_seq            # последовательность кредитов -> доменная GRU -> эмбеддинг
    type: embedding
    dim: 64
    tower: {hidden: [64, 32], dropout: 0.2}

  - name: bki_gru_cv         # стекинг: out-of-fold прогноз ансамбля GRU по фолдам (одно число)
    type: embedding
    dim: 1
    tower: {hidden: [8, 4], dropout: 0.0}

  - name: bki_agg            # агрегаты той же истории (стандартный подход банков)
    type: tabular
    dim: 48
    tower: {hidden: [64, 32], dropout: 0.2}
    tabular:
      categorical: []
      numerical: null        # все агрегаты
      log_patterns: []
      scaler: standard

model:
  head_hidden: [128, 64]
  head_dropout: 0.3
  use_presence_flags: true
  missing_embedding: learned_mean
  source_dropout: 0.1

train:
  batch_size: 2048
  epochs: 30
  lr: 0.001
  weight_decay: 0.00001
  pos_weight: null
  patience: 4
  scheduler_patience: 2
  calibration: platt
  device: auto

baselines:
  boosting: true
  single_source:
    bki_agg: "Бустинг на агрегатах (стандартный подход)"
  single_source_data: domain_fit+train   # столько же данных, сколько у GRU по фолдам
