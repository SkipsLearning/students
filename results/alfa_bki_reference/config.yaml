experiment:
  name: alfa_bki_unified
  seed: 42
  output_dir: runs
data:
  kind: alfa_bki
  synthetic:
    n_clients: 50000
    n_months: 24
    latent_dim: 10
    default_rate: 0.07
    cure_prob: 0.35
    interaction_strength: 0.8
    risk_scale: 1.8
    drift: 0.3
  home_credit:
    path: data/home-credit-default-risk
    nrows: null
    encoder_hidden: 64
    encoder_epochs: 6
    encoder_batch_size: 512
    encoder_lr: 0.001
  alfa_bki:
    path: data/data_for_competition
    n_clients: 500000
    take: latest
    max_len: 32
    encoder_hidden: 64
    encoder_epochs: 4
    encoder_batch_size: 1024
    encoder_lr: 0.002
    cv_folds: 5
    cv_score_source: bki_gru_cv
target:
  horizon_months: 12
  dpd_threshold: 90
  short_dpd_threshold: 30
  train_on: main
split:
  scheme: time
  domain_fit_periods:
  - 0
  - 6
  train_periods:
  - 7
  - 16
  val_periods:
  - 17
  - 19
  test_periods:
  - 20
  - 23
  fractions:
    domain_fit: 0.3
    train: 0.4
    val: 0.15
    test: 0.15
sources:
- name: bki_seq
  dim: 64
  type: embedding
  enabled: true
  tower:
    hidden:
    - 64
    - 32
    dropout: 0.2
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit: {}
- name: bki_gru_cv
  dim: 1
  type: embedding
  enabled: true
  tower:
    hidden:
    - 8
    - 4
    dropout: 0.0
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit: {}
- name: bki_agg
  dim: 48
  type: tabular
  enabled: true
  tower:
    hidden:
    - 64
    - 32
    dropout: 0.2
  tabular:
    categorical: []
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit: {}
model:
  head_hidden:
  - 128
  - 64
  head_dropout: 0.3
  use_presence_flags: true
  missing_embedding: learned_mean
  source_dropout: 0.1
train:
  batch_size: 2048
  epochs: 30
  lr: 0.001
  weight_decay: 1.0e-05
  pos_weight: null
  patience: 4
  scheduler_patience: 2
  calibration: platt
  device: auto
  num_threads: null
baselines:
  boosting: true
  single_source:
    bki_agg: Бустинг на агрегатах (стандартный подход)
  single_source_data: domain_fit+train
