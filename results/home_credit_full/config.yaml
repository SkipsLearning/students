experiment:
  name: home_credit_unified
  seed: 42
  output_dir: runs
data:
  kind: home_credit
  synthetic:
    n_clients: 50000
    n_months: 24
    latent_dim: 10
    default_rate: 0.07
    cure_prob: 0.35
    interaction_strength: 0.8
    risk_scale: 1.8
    drift: 0.3
  home_credit:
    path: data/home-credit-default-risk
    nrows: null
    encoder_hidden: 64
    encoder_epochs: 6
    encoder_batch_size: 512
    encoder_lr: 0.001
  alfa_bki:
    path: data/data_for_competition
    n_clients: 500000
    max_len: 32
    encoder_hidden: 64
    encoder_epochs: 4
    encoder_batch_size: 1024
    encoder_lr: 0.002
target:
  horizon_months: 12
  dpd_threshold: 90
  short_dpd_threshold: 30
  train_on: main
split:
  scheme: random
  domain_fit_periods:
  - 0
  - 5
  train_periods:
  - 6
  - 15
  val_periods:
  - 16
  - 19
  test_periods:
  - 20
  - 23
  fractions:
    domain_fit: 0.3
    train: 0.4
    val: 0.15
    test: 0.15
sources:
- name: card
  dim: 32
  type: embedding
  enabled: true
  tower:
    hidden:
    - 64
    - 32
    dropout: 0.2
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit:
    table: credit_card_balance
    max_len: 24
- name: account
  dim: 64
  type: embedding
  enabled: true
  tower:
    hidden:
    - 64
    - 32
    dropout: 0.2
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit:
    table: installments_payments
    max_len: 48
- name: bki
  dim: 256
  type: embedding
  enabled: true
  tower:
    hidden:
    - 128
    - 64
    dropout: 0.2
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit:
    table: bureau
    max_len: 32
- name: prev_app
  dim: 64
  type: embedding
  enabled: true
  tower:
    hidden:
    - 64
    - 32
    dropout: 0.2
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit:
    table: previous_application
    max_len: 16
- name: pos
  dim: 32
  type: embedding
  enabled: false
  tower:
    hidden:
    - 64
    - 32
    dropout: 0.2
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit:
    table: POS_CASH_balance
    max_len: 24
- name: graph
  dim: 768
  type: embedding
  enabled: false
  tower:
    hidden:
    - 256
    - 64
    dropout: 0.3
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns: []
    min_category_freq: 10
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit: {}
- name: tabular
  dim: 48
  type: tabular
  enabled: true
  tower:
    hidden:
    - 64
    - 32
    dropout: 0.2
  tabular:
    categorical: null
    numerical: null
    exclude: []
    log_patterns:
    - AMT_
    - CNT_CHILDREN
    - OBS_
    - DEF_
    min_category_freq: 30
    max_emb_dim: 16
    scaler: standard
  synthetic: {}
  home_credit: {}
model:
  head_hidden:
  - 128
  - 64
  head_dropout: 0.3
  use_presence_flags: true
  missing_embedding: learned_mean
  source_dropout: 0.1
train:
  batch_size: 1024
  epochs: 30
  lr: 0.001
  weight_decay: 1.0e-05
  pos_weight: null
  patience: 5
  scheduler_patience: 2
  calibration: platt
  device: auto
  num_threads: null
baselines:
  boosting: true
  single_source: {}
